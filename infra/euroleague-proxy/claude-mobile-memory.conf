# Memory ceiling for the always-on Claude session.
#
# Installed to ~/.config/systemd/user/claude-mobile.service.d/memory.conf
#
# Why: this session runs forever (the unit re-launches Claude in a `while
# true` loop) alongside a handful of MCP server children, so its footprint
# only ever grows -- it was already at 1.5G a quarter-hour into a fresh boot.
# On a WSL2 VM capped at 8G that is enough, over a multi-day uptime, to
# exhaust guest memory. When that happens the VM tends to wedge before the
# kernel OOM killer is ever scheduled, so nothing gets reclaimed, nothing
# gets killed, and the whole VM goes unresponsive -- recoverable only by
# `wsl --shutdown` from the Windows side.
#
# A cgroup ceiling turns that unrecoverable VM-wide freeze into a bounded,
# local failure. MemoryHigh throttles the cgroup and reclaims against it -- a
# soft brake that usually suffices on its own. MemoryMax is the hard stop:
# crossing it invokes the kernel OOM killer *scoped to this cgroup*, which
# kills a task inside it rather than the cgroup as a whole. That is the point:
# the runaway dies while the VM stays alive and reachable.
#
# What this deliberately does NOT promise: the unit is Type=forking around a
# tmux server, so if the OOM killer takes a Claude process or an MCP child,
# tmux survives, systemd sees no failure, and Restart=on-failure does not fire
# -- the unit's inner `while true` loop relaunches Claude instead. Only tmux
# itself dying triggers a real unit restart. Both paths are fine here; the
# goal is that the VM survives, not that any particular process does.
#
# The ceiling covers everything the session spawns, MCP servers included, as
# they all live in this cgroup.
#
# Requires cgroup v2 with the memory controller delegated to user@.service --
# check with: cat /sys/fs/cgroup/user.slice/user-*.slice/user@*.service/cgroup.controllers
# Without that delegation these directives are silently ignored.
[Service]
MemoryAccounting=yes
MemoryHigh=3G
MemoryMax=4G
