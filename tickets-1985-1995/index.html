<head>

<title>כרטיסי מכבי 1985–1995</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--ink:#14213d;--mute:#5b6478;--line:#dde2ec;--navy:#0b2a5b;--on-navy:#fff;--gold:#f2c200;--have:#1f8a4c;--miss:#c0392b;--chip:#e9edf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1420;--card:#172033;--ink:#e8ecf4;--mute:#9aa4b8;--line:#2a3550;--navy:#8fb4ff;--on-navy:#0e1420;--chip:#223050;--have:#4cc47f;--miss:#ff7b6b}}
:root[data-theme="dark"]{--bg:#0e1420;--card:#172033;--ink:#e8ecf4;--mute:#9aa4b8;--line:#2a3550;--navy:#8fb4ff;--on-navy:#0e1420;--chip:#223050;--have:#4cc47f;--miss:#ff7b6b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,"Segoe UI",Arial,sans-serif;direction:rtl;font-variant-numeric:tabular-nums}
button:focus-visible,select:focus-visible,input:focus-visible,.season:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
header{background:#0b2a5b;color:#fff;padding:22px 16px 18px;border-bottom:4px solid var(--gold)}
header h1{margin:0 0 4px;font-size:22px}
header p{margin:0;opacity:.85;font-size:14px}
main{max-width:1150px;margin:0 auto;padding:16px}
.kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;min-width:120px;flex:1}
.kpi b{display:block;font-size:24px}
.kpi span{color:var(--mute);font-size:13px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:6px 0}
.row>label{font-weight:600;min-width:80px;color:var(--mute);font-size:13px}
.chip{border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:4px 11px;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
input[type=search],select{font:inherit;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:var(--card);color:var(--ink)}
button.act{font:inherit;font-size:13px;padding:5px 12px;border-radius:7px;border:1px solid var(--navy);background:transparent;color:var(--navy);cursor:pointer}
.seasons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.season{border:1px solid var(--line);border-radius:8px;padding:7px 9px;cursor:pointer;background:var(--card)}
.season.on{outline:2px solid var(--navy)}
.season .t{display:flex;justify-content:space-between;font-size:13px}
.bar{height:7px;background:var(--miss);border-radius:4px;overflow:hidden;margin-top:5px;opacity:.85}
.bar i{display:block;height:100%;background:var(--have)}
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
th,td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:right;font-size:14px;vertical-align:top}
th{background:var(--chip);font-size:13px;position:sticky;top:env(safe-area-inset-top,0px)}
td.fn{font-size:12px;color:var(--mute);direction:rtl}
.tag{font-size:12px;padding:1px 7px;border-radius:999px;white-space:nowrap}
.tag.m{background:color-mix(in srgb,var(--miss) 18%,transparent);color:var(--miss)}
.tag.h{background:color-mix(in srgb,var(--have) 18%,transparent);color:var(--have)}
a{color:var(--navy)}
.count{color:var(--mute);font-size:13px;margin:6px 2px}
.tw{overflow-x:auto}
@media (max-width:700px){.hide-sm{display:none}}
</style>
</head>

  return `${first}‏–‏${second}`;
};
const outcome = g => g.ResultMaccabi === "" ? "" : +g.ResultMaccabi > +g.ResultOpponent ? "var(--have)" : +g.ResultMaccabi < +g.ResultOpponent ? "var(--miss)" : "var(--mute)";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));

function render() {
  chips($("f-status"), [["missing", "רק חסרים"], ["have", "רק קיימים"], ["all", "הכל"]], k => state.status === k, k => state.status = k);
  chips($("f-comp"), comps.map(c => [c, c]), k => state.comps.has(k), k => toggle(state.comps, k));
  chips($("f-ha"), ["בית", "חוץ", "נייטרלי", "רדיוס"].map(k => [k, k]), k => state.ha.has(k), k => toggle(state.ha, k));

  const base = GAMES.filter(baseFilter);
  const bySeason = {};
  base.forEach(g => { (bySeason[g.Season] ||= {have: 0, total: 0}).total++; if (has(g)) bySeason[g.Season].have++; });
  $("seasons").innerHTML = Object.keys(bySeason).sort().map(s => {
    const {have, total} = bySeason[s];
    return `<div class="season${state.seasons.has(s) ? " on" : ""}" data-s="${s}"><div class="t"><b>${s}</b><span>חסרים ${total - have}/${total}</span></div><div class="bar"><i style="width:${100 * have / total}%"></i></div></div>`;
  }).join("");
  document.querySelectorAll(".season").forEach(el => el.onclick = () => { toggle(state.seasons, el.dataset.s); render(); });

  const inScope = base.filter(g => !state.seasons.size || state.seasons.has(g.Season));
  const haveN = inScope.filter(has).length;
  $("kpis").innerHTML = `<div class="kpi"><b>${inScope.length}</b><span>משחקים בטווח</span></div><div class="kpi"><b style="color:var(--have)">${haveN}</b><span>יש לנו כרטיס</span></div><div class="kpi"><b style="color:var(--miss)">${inScope.length - haveN}</b><span>חסר כרטיס</span></div><div class="kpi"><b>${inScope.length ? Math.round(100 * haveN / inScope.length) : 0}%</b><span>כיסוי</span></div>`;

  const rows = GAMES.filter(fullFilter);
  $("count").textContent = `${rows.length} משחקים ברשימה`;
  $("rows").innerHTML = rows.map(g => {
    const title = g.HomeAway === "בית" ? `מכבי ת"א – ${g.Opponent}` : `${g.Opponent} – מכבי ת"א`;
    const tag = has(g) ? `<a class="tag h" href="${WIKI}File:${encodeURIComponent(g.ticket_file)}" target="_blank">יש</a>` : `<span class="tag m">חסר</span>`;
    return `<tr><td>${fmtDate(g.Date)}</td><td>${g.Season}</td><td>${esc(g.Competition)}${g.Leg ? " · " + esc(g.Leg) : ""}</td><td><a href="${WIKI}${encodeURIComponent(g.page)}" target="_blank">${esc(title)}</a></td><td class="hide-sm">${g.HomeAway}</td><td dir="rtl" style="color:${outcome(g)};font-weight:600;white-space:nowrap">${result(g)}</td><td>${tag}</td><td class="fn hide-sm">${has(g) ? "" : esc(g.expected_name) + ".jpg"}</td></tr>`;
  }).join("");
}

[$("y-from"), $("y-to")].forEach((sel, i) => {
  sel.innerHTML = years.map(y => `<option>${y}</option>`).join("");
  sel.value = i ? state.to : state.from;
  sel.onchange = () => { state[i ? "to" : "from"] = +sel.value; render(); };
});
$("q").oninput = e => { state.q = e.target.value.trim(); render(); };
$("reset").onclick = () => location.reload();
$("copy").onclick = async () => {
  const head = ["תאריך", "עונה", "מפעל", "שלב", "יריבה", "בית/חוץ", "אצטדיון", "תוצאה (מכבי-יריבה)", "יש כרטיס"];
  const lines = GAMES.filter(fullFilter).map(g => [fmtDate(g.Date), g.Season, g.Competition, g.Leg, g.Opponent, g.HomeAway, g.Stadium, g.ResultMaccabi === "" ? "" : `${g.ResultMaccabi}-${g.ResultOpponent}`, has(g) ? "כן" : "לא"]);
  const text = [head, ...lines].map(r => r.join("\t")).join("\n");
  try {
    await navigator.clipboard.writeText(text);
  } catch (err) {
    const area = document.createElement("textarea");
    area.value = text;
    document.body.appendChild(area);
    area.select();
    document.execCommand("copy");
    area.remove();
  }
  $("copy").textContent = `הועתקו ${lines.length} שורות ✓`;
  setTimeout(() => { $("copy").textContent = "העתק רשימה (לאקסל)"; }, 2500);
};
render();
</script>

</body>
</html>
